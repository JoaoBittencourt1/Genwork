schema: spec-driven

context: |
  Product: Genwork — a modular, self-hosted workspace platform that centralizes
  task management, team workflows, infrastructure insights, and automation.
  Modular: a minimal core (auth, users, workspaces, roles, projects, module registry, settings) plus
  optional modules (kanban, infra insights, automation, ...), each its own container, Postgres schema,
  and release. Installations pick modules through the installer CLI; modules can be enabled/disabled
  without impacting core or other modules (constitution rules 49-64).
  Monorepo: core/ and modules/<name>/ (Go services), sdk/go/, cli/ (Go installer), web/ (Vite + React static SPA),
  clients/macos (Swift/SwiftUI), clients/windows (C#/.NET, UI TBD), clients/linux (Rust/GTK 4), deploy/.
  The constitution.md at the repo root is binding; read it in full before exploring, proposing, or applying.

rules:
  proposal:
    - Write in English
    - State which components the change touches (core, which modules, sdk, cli, web, macos, windows, linux)
    - If it adds a module, list its module.yaml facts (dependencies, permissions, events, API prefix)
    - Include a "Non-goals" section
  design:
    - Write in English
    - Reference constitution rules by number when a decision depends on them
  tasks:
    - Write in English
    - Split work into numbered phases, one branch and one PR per phase (constitution rules 42-48)
    - Start with the phased delivery table (| Phase | Contents | Depends on | Parallel with |)
    - Each phase starts with its tests and ends with lint, tests, and "Open PR"
    - Name each phase's branch as tipo/short-slug (constitution rule 39)
