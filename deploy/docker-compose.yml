name: genwork

# Every Genwork image is the release named by VERSION: `genwork` sets GENWORK_VERSION from it on every call (design §2).
# Builds from source and the mail catcher live in docker-compose.dev.yml, which `genwork` adds in a clone of the repository.
x-core: &core
  image: ${GENWORK_IMAGE_REGISTRY:?set it in deploy/.env}/genwork-core:${GENWORK_VERSION:?run compose through genwork}
  env_file: .env

x-gentasks: &gentasks
  image: ${GENWORK_IMAGE_REGISTRY:?set it in deploy/.env}/genwork-gentasks:${GENWORK_VERSION:?run compose through genwork}
  env_file: .env

x-genmonitor: &genmonitor
  image: ${GENWORK_IMAGE_REGISTRY:?set it in deploy/.env}/genwork-genmonitor:${GENWORK_VERSION:?run compose through genwork}
  env_file: .env

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-migrate:
    <<: *core
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  core:
    <<: *core
    command: ["serve"]
    ports:
      - "127.0.0.1:${CORE_PORT}:${CORE_PORT}"
    depends_on:
      core-migrate:
        condition: service_completed_successfully

  core-worker:
    <<: *core
    command: ["worker"]
    depends_on:
      core-migrate:
        condition: service_completed_successfully

  # Module services run only when the module is installed: `genwork` passes one --profile per installed module.
  # The gentasks role and schema are provisioned by the CLI before this runs (rule 53).
  gentasks-migrate:
    <<: *gentasks
    profiles: ["gentasks"]
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # No host port: modules are reached only through the gateway (rule 57).
  gentasks:
    <<: *gentasks
    profiles: ["gentasks"]
    command: ["serve"]
    depends_on:
      gentasks-migrate:
        condition: service_completed_successfully
      core:
        condition: service_started

  # genmonitor keeps no data; its migrate service only exists because the installer runs one per module.
  genmonitor-migrate:
    <<: *genmonitor
    profiles: ["genmonitor"]
    command: ["migrate"]
    restart: "no"

  # The host's procfs and root file system, read-only, so the metrics describe the machine instead of this container.
  # Under Docker Desktop or Colima that machine is the Linux VM running Docker.
  genmonitor:
    <<: *genmonitor
    profiles: ["genmonitor"]
    command: ["serve"]
    volumes:
      - /proc:/host/proc:ro
      - /:/host/root:ro
    depends_on:
      genmonitor-migrate:
        condition: service_completed_successfully
      core:
        condition: service_started

  # deploy/Caddyfile is generated by `genwork` from the installed modules; the image carries the built web app (rule 65).
  gateway:
    image: ${GENWORK_IMAGE_REGISTRY:?set it in deploy/.env}/genwork-gateway:${GENWORK_VERSION:?run compose through genwork}
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}"
    networks:
      default:
        # Fixed so core can trust X-Forwarded-For from the gateway alone (TRUSTED_PROXY_CIDRS, rule 68).
        ipv4_address: ${GATEWAY_IPV4}
    depends_on:
      core:
        condition: service_started

  # The remote MCP server: assistants reach it only through the gateway at /mcp (rule 57), with a core access token.
  mcp:
    image: ${GENWORK_IMAGE_REGISTRY:?set it in deploy/.env}/genwork-mcp:${GENWORK_VERSION:?run compose through genwork}
    command: ["serve-http"]
    env_file: .env
    depends_on:
      core:
        condition: service_started

  # The only container with the Docker socket (rule 84): no published port and no gateway route, and it answers only
  # core, which presents GENWORK_UPDATER_SECRET. The installation sits at the same path inside and outside, so the
  # relative bind mounts compose resolves for it (./Caddyfile) still point at the host's files.
  updater:
    image: ${GENWORK_IMAGE_REGISTRY:?set it in deploy/.env}/genwork-updater:${GENWORK_VERSION:?run compose through genwork}
    env_file: .env
    volumes:
      - ${DOCKER_SOCKET_PATH:?set it in deploy/.env}:/var/run/docker.sock
      - ${GENWORK_HOME:?genwork sets it in deploy/.env}:${GENWORK_HOME:?genwork sets it in deploy/.env}
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${GENWORK_NETWORK_SUBNET}

volumes:
  postgres-data:
