name: genwork

x-core: &core
  build:
    context: ../core
  image: genwork-core:dev
  env_file: .env

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"

  core-migrate:
    <<: *core
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  core:
    <<: *core
    command: ["serve"]
    ports:
      - "127.0.0.1:${CORE_PORT}:${CORE_PORT}"
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  core-worker:
    <<: *core
    command: ["worker"]
    depends_on:
      core-migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
