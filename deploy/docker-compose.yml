name: genwork

x-core: &core
  build:
    context: ../core
  image: genwork-core:dev
  env_file: .env

x-gentasks: &gentasks
  build:
    context: ..
    dockerfile: modules/gentasks/Dockerfile
  image: genwork-gentasks:dev
  env_file: .env

x-genmonitor: &genmonitor
  build:
    context: ..
    dockerfile: modules/genmonitor/Dockerfile
  image: genwork-genmonitor:dev
  env_file: .env

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"

  core-migrate:
    <<: *core
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  core:
    <<: *core
    command: ["serve"]
    ports:
      - "127.0.0.1:${CORE_PORT}:${CORE_PORT}"
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  core-worker:
    <<: *core
    command: ["worker"]
    depends_on:
      core-migrate:
        condition: service_completed_successfully

  # Module services run only when the module is installed: `genwork` passes one --profile per installed module.
  # The gentasks role and schema are provisioned by the CLI before this runs (rule 53).
  gentasks-migrate:
    <<: *gentasks
    profiles: ["gentasks"]
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # No host port: modules are reached only through the gateway (rule 57).
  gentasks:
    <<: *gentasks
    profiles: ["gentasks"]
    command: ["serve"]
    depends_on:
      gentasks-migrate:
        condition: service_completed_successfully
      core:
        condition: service_started

  # genmonitor keeps no data; its migrate service only exists because the installer runs one per module.
  genmonitor-migrate:
    <<: *genmonitor
    profiles: ["genmonitor"]
    command: ["migrate"]
    restart: "no"

  # The host's procfs and root file system, read-only, so the metrics describe the machine instead of this container.
  # Under Docker Desktop or Colima that machine is the Linux VM running Docker.
  genmonitor:
    <<: *genmonitor
    profiles: ["genmonitor"]
    command: ["serve"]
    volumes:
      - /proc:/host/proc:ro
      - /:/host/root:ro
    depends_on:
      genmonitor-migrate:
        condition: service_completed_successfully
      core:
        condition: service_started

  # deploy/Caddyfile is generated by `genwork` from the installed modules.
  gateway:
    image: caddy:2.10-alpine
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}"
    networks:
      default:
        # Fixed so core can trust X-Forwarded-For from the gateway alone (TRUSTED_PROXY_CIDRS, rule 68).
        ipv4_address: ${GATEWAY_IPV4}
    depends_on:
      core:
        condition: service_started

networks:
  default:
    ipam:
      config:
        - subnet: ${GENWORK_NETWORK_SUBNET}

volumes:
  postgres-data:
