name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      sdk: ${{ steps.filter.outputs.sdk }}
      gentasks: ${{ steps.filter.outputs.gentasks }}
      genmonitor: ${{ steps.filter.outputs.genmonitor }}
      cli: ${{ steps.filter.outputs.cli }}
      mcp: ${{ steps.filter.outputs.mcp }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            core:
              - 'core/**'
              - 'sdk/go/coretest/fixtures/**'
              - 'VERSION'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            sdk:
              - 'sdk/**'
              - 'VERSION'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            gentasks:
              - 'modules/gentasks/**'
              - 'sdk/**'
              - 'VERSION'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            genmonitor:
              - 'modules/genmonitor/**'
              - 'sdk/**'
              - 'VERSION'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            cli:
              - 'cli/**'
              - 'sdk/**'
              - 'modules/*/module.yaml'
              - 'deploy/**'
              - 'VERSION'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            mcp:
              - 'mcp/**'
              - 'sdk/**'
              - 'VERSION'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'VERSION'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  core:
    name: Core · Lint · Test · Build
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: genwork
          POSTGRES_PASSWORD: genwork
          POSTGRES_DB: genwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://genwork:genwork@localhost:5432/genwork_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: make lint-core
      - run: make test-core
      - run: make build-core

  sdk:
    name: SDK · Lint · Test
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - run: make lint-sdk
      - run: make test-sdk

  gentasks:
    name: Gentasks · Lint · Test · Build
    needs: changes
    if: needs.changes.outputs.gentasks == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: genwork
          POSTGRES_PASSWORD: genwork
          POSTGRES_DB: genwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://genwork:genwork@localhost:5432/genwork_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/gentasks/go.mod
          cache-dependency-path: modules/gentasks/go.sum
      - run: make lint-gentasks
      - run: make test-gentasks
      - run: make build-gentasks

  genmonitor:
    name: Genmonitor · Lint · Test · Build
    needs: changes
    if: needs.changes.outputs.genmonitor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/genmonitor/go.mod
          cache-dependency-path: modules/genmonitor/go.sum
      - run: make lint-genmonitor
      - run: make test-genmonitor
      - run: make build-genmonitor

  cli:
    name: CLI · Lint · Test · Build
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: make lint-cli
      - run: make test-cli
      - run: make build-cli

  mcp:
    name: MCP · Lint · Test · Build
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: make lint-mcp
      - run: make test-mcp
      - run: make build-mcp

  web:
    name: Web · Lint (audit) · Test · Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make lint-web
      - run: make test-web
      - run: make build-web
