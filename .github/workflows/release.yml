name: Release

# Pushing v<VERSION> publishes the platform release (design §4). Every check and build is a make target (rule 75).
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Gates · Images · Release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: genwork
          POSTGRES_PASSWORD: genwork
          POSTGRES_DB: genwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://genwork:genwork@localhost:5432/genwork_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - run: make check-release-tag RELEASE_TAG="${GITHUB_REF_NAME}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make lint
      - run: make test
      - run: make build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR names must be lowercase; the owner's login may not be.
      - run: echo "GENWORK_IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - run: make release-images
      - run: make release-artifacts
      - run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Genwork ${GITHUB_REF_NAME}" dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
